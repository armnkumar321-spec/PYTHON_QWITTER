<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwitter - One-Word Gemini Q&A</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --accent-glow: rgba(168, 85, 247, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px var(--accent-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            font-size: 0.85rem;
            font-weight: 600;
            color: #d8b4fe;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
        }

        button.ask-btn {
            padding: 16px 28px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 100px;
        }

        button.ask-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        button.ask-btn:active {
            transform: translateY(0);
        }

        button.ask-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pill.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-pill.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .question-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .answer-display {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin: 12px 0;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .json-preview {
            margin-top: 16px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #a7f3d0;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="brand-badge">Gemini Powered</span>
            <h1>Qwitter Web</h1>
            <p class="subtitle">Ask any question and get a precise 1-word answer</p>
        </div>

        <form id="qwitter-form" onsubmit="handleAsk(event)">
            <div class="input-group">
                <input 
                    type="text" 
                    id="question-input" 
                    placeholder="e.g. what is the capital of india"
                    required
                    autocomplete="off"
                />
                <button type="submit" id="ask-btn" class="ask-btn">
                    <span id="btn-text">Ask</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>
            </div>
        </form>

        <div id="result-card" class="result-card">
            <div class="result-header">
                <span class="question-label" id="res-question-label">Question</span>
                <span class="status-pill" id="res-status-pill">Success</span>
            </div>
            
            <div id="success-content">
                <div class="answer-display" id="res-answer">Delhi</div>
            </div>

            <div id="error-content" style="display: none;">
                <div class="error-message" id="res-error">An error occurred</div>
            </div>

            <div class="json-preview" id="res-json"></div>
        </div>
    </div>

    <script>
        async function handleAsk(event) {
            event.preventDefault();
            const input = document.getElementById('question-input');
            const askBtn = document.getElementById('ask-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const resultCard = document.getElementById('result-card');
            const statusPill = document.getElementById('res-status-pill');
            const questionLabel = document.getElementById('res-question-label');
            const answerDisplay = document.getElementById('res-answer');
            const successContent = document.getElementById('success-content');
            const errorContent = document.getElementById('error-content');
            const errorMessage = document.getElementById('res-error');
            const jsonPreview = document.getElementById('res-json');

            const question = input.value.trim();
            if (!question) return;

            // UI Loading state
            askBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();

                resultCard.style.display = 'block';
                questionLabel.textContent = `"${data.question || question}"`;
                jsonPreview.textContent = JSON.stringify(data, null, 2);

                if (data.status === 'success' && data.answer) {
                    statusPill.textContent = 'Success';
                    statusPill.className = 'status-pill success';
                    answerDisplay.textContent = data.answer;
                    successContent.style.display = 'block';
                    errorContent.style.display = 'none';
                } else {
                    statusPill.textContent = 'Error';
                    statusPill.className = 'status-pill error';
                    errorMessage.textContent = data.error || 'Failed to fetch answer.';
                    successContent.style.display = 'none';
                    errorContent.style.display = 'block';
                }

            } catch (err) {
                resultCard.style.display = 'block';
                statusPill.textContent = 'Error';
                statusPill.className = 'status-pill error';
                errorMessage.textContent = 'Network or server error: ' + err.message;
                successContent.style.display = 'none';
                errorContent.style.display = 'block';
                jsonPreview.textContent = JSON.stringify({ error: err.message }, null, 2);
            } finally {
                askBtn.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
